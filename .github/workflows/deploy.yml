name: Deploy

on:
  push:
    branches: [main, v2]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          GITHUB_PAGES: "true"
          VITE_FIREBASE_API_KEY: "AIzaSyBX-WZo7pnLRI43RnZYptW60FXY3ayB0kc"
          VITE_FIREBASE_AUTH_DOMAIN: "planning-with-ai-a3485.firebaseapp.com"
          VITE_FIREBASE_PROJECT_ID: "planning-with-ai-a3485"
          VITE_FIREBASE_STORAGE_BUCKET: "planning-with-ai-a3485.firebasestorage.app"
          VITE_FIREBASE_MESSAGING_SENDER_ID: "303429363708"
          VITE_FIREBASE_APP_ID: "1:303429363708:web:b2df55578c0cf0e3de7479"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
